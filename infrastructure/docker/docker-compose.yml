services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: betcore
      POSTGRES_PASSWORD: betcore
      POSTGRES_DB: betcore
    ports:
      - "5432:5432"
    volumes:
      - betcore_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - betcore_redis_data:/data

volumes:
  betcore_postgres_data:
  betcore_redis_data:
